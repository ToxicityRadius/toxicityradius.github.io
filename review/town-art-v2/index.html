<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A quieter town · Artwork study</title><link rel="icon" href="../../favicon.svg">
  <style>
    @font-face{font-family:Outfit;src:url('../../fonts/outfit.ttf');font-weight:400;font-display:swap}
    @font-face{font-family:Fraunces;src:url('../../fonts/fraunces.ttf');font-weight:500;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#f8f5ec;color:#283f33;font:16px/1.5 Outfit,system-ui,sans-serif}main{width:min(1440px,100%);margin:auto;padding:64px 40px 80px}header{margin-bottom:32px}.eyebrow{margin:0 0 14px;color:#68705d;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{font:500 clamp(38px,6vw,70px)/1.08 Fraunces,Georgia,serif;letter-spacing:-.04em;margin:0}figure{margin:0}img{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;background:#e2e7ce}figcaption{margin-top:12px;color:#68705d;font-size:13px}.mobile-study{margin-top:64px;padding-top:28px;border-top:1px solid #d7dccb}.mobile-study h2{font:500 28px/1.2 Fraunces,Georgia,serif;margin:0 0 24px}.phone{width:min(390px,100%);background:#f8f5ec;border:1px solid #d7dccb;padding:8px}.project-links{display:grid;gap:8px;padding:12px 4px 4px}.project-links a{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border:1px solid #cdd5c3;color:inherit;text-decoration:none}.project-links small{color:#68705d;font-size:12px}.project-links span{font-size:14px;text-align:right}a:focus-visible{outline:3px solid #a7592b;outline-offset:3px}@media(hover:hover) and (pointer:fine){.project-links a:hover{background:#eaf0e2}}@media(max-width:600px){main{padding:36px 16px 48px}header{margin-bottom:24px}.mobile-study{margin-top:40px}.project-links a{gap:8px;padding:10px 8px}.project-links span{font-size:13px}}
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">Static artwork study · 01</p><h1>A quieter town.</h1></header>
    <figure>
      <img src="../../images/town-master-v2.png" width="1672" height="941" alt="A quiet countryside pixel-art town with a campus, workshop, and library connected by a walking path.">
      <figcaption>The complete composition · desktop</figcaption>
    </figure>
    <section class="mobile-study" aria-labelledby="mobile-title">
      <h2 id="mobile-title">The same town, on a smaller screen.</h2>
      <div class="phone">
        <img src="../../images/town-master-v2.png" width="1672" height="941" alt="The complete town at phone width.">
        <nav class="project-links" aria-label="Town projects">
          <a href="../../projects/student-advising-portal/"><small>Campus</small><span>Student Advising Portal ↗</span></a>
          <a href="../../projects/formproof/"><small>Workshop</small><span>FormProof ↗</span></a>
          <a href="../../projects/claimcheck/"><small>Library</small><span>ClaimCheck ↗</span></a>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
