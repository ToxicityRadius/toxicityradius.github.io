<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=https://dexter-soriano-portfolio.pages.dev/">
    <meta name="robots" content="noindex">
    <title>Moving to Dexter’s portfolio</title>
    <script>
      const destination = new URL("https://dexter-soriano-portfolio.pages.dev/");
      const path = location.pathname === "/index.html" ? "/" : location.pathname;
      destination.pathname = path;
      destination.search = location.search;
      destination.hash = location.hash;
      location.replace(destination.href);
    </script>
  </head>
  <body>
    <p>Dexter’s portfolio has moved. <a href="https://dexter-soriano-portfolio.pages.dev/">Open the new site</a>.</p>
  </body>
</html>
